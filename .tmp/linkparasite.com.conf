upstream linkparasite_com_backend {
    server 127.0.0.1:5091;
    keepalive 64;
}

# ======================================================
# HTTPS — wildcard (main + www + tüm subdomainler)
# ======================================================
server {
    server_name linkparasite.com www.linkparasite.com *.linkparasite.com;

    listen 45.141.58.78:443 ssl;
    http2 on;

    ssl_certificate     "/var/www/httpd-cert/linkparasite.com_2026-05-21-18-54_15.crt";
    ssl_certificate_key "/var/www/httpd-cert/linkparasite.com_2026-05-21-18-54_15.key";

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_timeout 10m;

    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml image/svg+xml font/ttf font/otf application/vnd.ms-fontobject;
    gzip_comp_level 5;

    set $root_path /var/www/kirveler_net_usr/data/www/linkparasite.com;
    root $root_path;
    disable_symlinks if_not_owner from=$root_path;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src * https: data: blob: 'unsafe-inline' 'unsafe-eval'; script-src * https: data: blob: 'unsafe-inline' 'unsafe-eval'; style-src * https: data: 'unsafe-inline'; img-src * https: data: blob:; font-src * https: data:; media-src * https: blob:; connect-src * https: wss: ws:; frame-src * https:; frame-ancestors https://linkparasite.com https://www.linkparasite.com https://*.linkparasite.com;" always;

    proxy_intercept_errors off;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Ssl on;

    location ^~ /v2 {
        proxy_pass http://linkparasite_com_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Ssl on;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 10s;
        proxy_buffering off;
        proxy_cache off;
        proxy_redirect off;
        proxy_intercept_errors off;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot|otf|map|webp|mp4|webm|pdf|zip)$ {
        proxy_pass http://linkparasite_com_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Ssl on;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_redirect off;
        proxy_intercept_errors off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        proxy_buffering off;
    }

    location ^~ /api/ {
        proxy_pass http://linkparasite_com_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Ssl on;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_buffering off;
        proxy_cache off;
        proxy_redirect off;
        proxy_intercept_errors off;
    }

    location ^~ /apijson/ {
        proxy_pass http://linkparasite_com_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Ssl on;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_buffering off;
        proxy_cache off;
        proxy_redirect off;
        proxy_intercept_errors off;
    }

    location / {
        proxy_pass http://linkparasite_com_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Ssl on;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_buffering off;
        proxy_cache off;
        client_max_body_size 10M;
        proxy_redirect off;
        proxy_intercept_errors off;
    }

    error_page 502 503 504 /50x.html;
    location = /50x.html { root /usr/share/nginx/html; internal; }

    include "/etc/nginx/fastpanel2-sites/kirveler_net_usr/linkparasite.com.includes";
    include /etc/nginx/fastpanel2-includes/*.conf;

    error_log  /var/www/kirveler_net_usr/data/logs/linkparasite.com-frontend.error.log warn;
    access_log /var/www/kirveler_net_usr/data/logs/linkparasite.com-frontend.access.log combined;
}

# ======================================================
# HTTP → HTTPS redirect
# ======================================================
server {
    server_name linkparasite.com www.linkparasite.com *.linkparasite.com;
    listen 45.141.58.78:80;
    return 301 https://$host$request_uri;
}
